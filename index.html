<meta name="description" content="ระบบจัดการและรายงานผลการแข่งขันกีฬา-กรีฑาภายใน กีฬาอัญมณี 2569 โรงเรียนสิงห์สมุทร">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  /* โลกสีเดียวกับสูจิบัตร: กรมท่าเข้ม + ทองเหรียญ · แถบนำทางบน เนื้อหาเป็นการ์ดเรียงลง */
  /* โทนน้ำเงิน-ขาว ตามตราโรงเรียน · ทอง/เงิน/ทองแดงใช้เฉพาะความหมายของเหรียญ */
  --bg:#F2F5FC; --panel:#FFFFFF; --panel2:#EEF2FB; --line:#D7DFF1; --ink:#14215A; --muted:#5D6A93;
  --blue:#3B4FA8; --blue-d:#22327A; --blue-l:#E4EAFB;
  --gold:#E3A812; --silver:#9AA3B5; --bronze:#C77A3A; --gold-t:#A97A00; --silver-t:#6E7890; --bronze-t:#A65E22;
  --ok:#23854F; --warn:#B26B00; --bad:#C8323A;
  --display:'Noto Sans Thai','Leelawadee UI',Tahoma,system-ui,sans-serif; --body:'Noto Sans Thai','Leelawadee UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
body{background:radial-gradient(1200px 500px at 85% -10%,#2A1F6B 0%,transparent 60%),var(--bg);min-height:100%}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:13px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
header.top{position:sticky;top:0;z-index:5;background:rgba(13,17,64,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar1{display:flex;gap:12px;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}
.gems{display:flex;gap:1px}.gems .gem{width:18px;height:18px}
.brand b{font:600 18px var(--display);letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.right{display:flex;gap:10px;align-items:center}
#status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.d-ok{background:var(--ok)}.dot.d-warn{background:var(--warn)}
#nav{display:flex;gap:2px;max-width:1180px;margin:0 auto;padding:0 12px;overflow-x:auto;scrollbar-width:none}
#nav a{padding:9px 12px;text-decoration:none;color:var(--muted);font:500 14px var(--display);white-space:nowrap;border-bottom:3px solid transparent}
#nav a.on{color:var(--ink);border-color:var(--gold)}
#nav a:focus-visible,button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main>*,.card,.two>*,.adgrid>*{min-width:0}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.hero h1{font:600 26px/1.25 var(--display);margin:0 0 4px;text-wrap:balance}
.hero p{margin:0}
.prog{height:6px;background:var(--panel2);border-radius:6px;margin-top:10px;overflow:hidden}.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FFE29A)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{font:600 17px var(--display);margin:0 0 10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.btn{font:500 14px var(--display);background:var(--gold);color:#1B1600;border:0;border-radius:9px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #6B2E3C}
.btn.sm{padding:4px 10px;font-size:13px}
#editbtn{background:transparent;color:var(--gold);border:1px solid var(--gold)}#editbtn.on{background:var(--gold);color:#1B1600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.more{display:inline-block;margin-top:8px;color:var(--gold);text-decoration:none;font-size:14px}
/* ทีม */
.tm{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 4px;border-radius:999px;background:color-mix(in srgb,var(--tc) 18%,transparent);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);font-weight:500;font-size:14px;white-space:nowrap}
.tm .gem{width:17px;height:17px}
.tm.tbd{background:transparent;border:1px dashed var(--line);color:var(--muted);padding:2px 10px;font-weight:400;font-size:13px}
.tm.win{background:var(--tc);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}.tm.win .gem{filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9))}
.tm.lose{opacity:.5}
/* ตารางเหรียญ */
table{border-collapse:collapse;width:100%}
.medal{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.medal th{font:500 13px var(--display);color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.medal td{padding:10px 12px;border-bottom:1px solid var(--line)}
.medal tr:last-child td{border-bottom:0}
.medal td.num{font:600 22px var(--display);text-align:center}.medal th.g,.medal th.s,.medal th.b{text-align:center}
.medal .g{color:var(--gold)}.medal .s{color:var(--silver)}.medal .b{color:var(--bronze)}.medal .tot{color:var(--ink)}
.medal .rk{font:700 22px var(--display);width:60px;text-align:center;box-shadow:inset 4px 0 0 var(--tc)}
.medal .tm{font-size:16px;padding:4px 14px 4px 6px}.medal .tm i{width:18px;height:18px}
.barcol{width:28%}.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2)}.bar span{height:100%}.bar .g{background:var(--gold)}.bar .s{background:var(--silver)}.bar .b{background:var(--bronze)}
.feed{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.feed:first-of-type{border-top:0}.feed .fl{font-weight:500}.feed.sm{padding:5px 0}.feed.sm .fl{font-size:13px;color:var(--muted)}
.pod{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.md{position:relative;display:inline-flex;align-items:center;gap:4px}
.md::before{content:"";width:8px;height:8px;border-radius:50%}
.md.g::before{background:var(--gold)}.md.s::before{background:var(--silver)}.md.b::before{background:var(--bronze)}
.md small{color:var(--muted);font-size:12px}
.sportgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
details{background:var(--panel2);border-radius:10px;padding:8px 12px}
details>summary{cursor:pointer;display:flex;justify-content:space-between;font:500 15px var(--display);list-style:none}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{margin-bottom:6px}
.mt{margin-top:12px}
/* โปรแกรม */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px;overflow-x:auto}
.seg.wrap{flex-wrap:wrap}
.seg button{background:transparent;border:0;color:var(--muted);font:500 14px var(--display);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--gold);color:#1B1600}
select,input,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;font:12px/1.4 ui-monospace,monospace}
.mrow{display:grid;grid-template-columns:52px minmax(170px,1fr) auto 76px;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid var(--line);border-radius:8px}
.card h2+.mrow{border-top:0}
.mrow.compact{grid-template-columns:46px 1fr}.mrow.compact .vsline{grid-column:2;justify-content:flex-start}

.tv h1{color:var(--blue-d)}
.tvc{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 16%,#fff) 0%,#fff 60%);border-color:color-mix(in srgb,var(--tc) 55%,#fff);box-shadow:0 2px 10px rgba(34,50,122,.08)}
.tvc .nm{color:var(--ink)}.tvc .g{color:var(--gold-t)}.tvc .s{color:var(--silver-t)}.tvc .b{color:var(--bronze-t)}

.md.g::before{background:var(--gold)}.md.s::before{background:var(--silver)}.md.b::before{background:var(--bronze)}


/* ===== live status ===== */
:root{--live:#E0263A}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(224,38,58,.55)}70%{box-shadow:0 0 0 7px rgba(224,38,58,0)}100%{box-shadow:0 0 0 0 rgba(224,38,58,0)}}
@keyframes liveblink{50%{opacity:.35}}
.livebadge{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--display);color:#fff;background:var(--live);border-radius:999px;padding:2px 9px 2px 7px;white-space:nowrap;letter-spacing:.2px}
.livebadge i,.livetag i,.livechip i{width:7px;height:7px;border-radius:50%;background:#fff;animation:liveblink 1.2s infinite}
.livetag{position:absolute;top:-10px;right:10px;display:inline-flex;align-items:center;gap:4px;background:var(--live);color:#fff;font:700 10px var(--display);letter-spacing:.6px;padding:2px 8px;border-radius:999px;box-shadow:0 2px 6px rgba(224,38,58,.35)}
.node.match.islive{border:2px solid var(--live);animation:livepulse 1.8s infinite}
.mrow.islive,.cirow.islive{background:linear-gradient(90deg,rgba(224,38,58,.07),transparent 60%);box-shadow:inset 3px 0 0 var(--live)}
.mrow.islive .tt,.cirow.islive .tt{color:var(--live)}
.sc.lvsc{color:var(--live)}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-left:6px;vertical-align:1px;animation:livepulse 1.8s infinite}
.livechip{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;text-decoration:none;font:600 12px var(--display);border-radius:999px;padding:4px 11px;animation:livepulse 1.8s infinite}
.livetoggle{background:#FFF1F2;border:1px solid #F7C6CC;border-radius:10px;padding:8px 10px;margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.livetoggle.idle{background:var(--panel2);border-color:var(--line)}
/* ===== hover card ===== */
#tip{position:fixed;z-index:40;max-width:330px;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 14px 40px rgba(20,33,90,.22);font-size:13px;color:var(--ink);pointer-events:none}
#tip[hidden]{display:none}
.tt-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}.tt-h b{display:block;font:600 15px var(--display);color:var(--blue-d)}.tt-h small{color:var(--muted);font-size:12px}
.tt-h .sic.tile{width:30px;height:30px;padding:6px;margin:0}
.tr{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-top:1px dashed var(--line);align-items:center}
.tr>span{color:var(--muted)}.tr .livebadge{color:#fff}.tr .tm{color:var(--ink)}.tr .pill.done{color:var(--ok)}.tr b{font-weight:500;text-align:right;display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tr.hi{background:var(--blue-l);border-radius:6px;padding:4px 6px}
.tt-sec{padding:6px 0;border-top:1px dashed var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tt-mut{color:var(--muted);font-size:12px;padding-top:6px;border-top:1px dashed var(--line)}
.tt-txt{font-weight:500}
.tt-vs{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 0 8px;flex-wrap:wrap}.tt-vs b{font:600 16px var(--display);color:var(--blue-d)}
.tt-med{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px;text-align:center}
.tt-med span{background:var(--panel2);border-radius:8px;padding:4px 0;font:600 18px var(--display)}.tt-med small{display:block;font:400 11px var(--body);color:var(--muted)}
.tt-med .g{color:var(--gold-t)}.tt-med .s{color:var(--silver-t)}.tt-med .b{color:var(--bronze-t)}
[data-tip]{cursor:help}.click[data-tip],a[data-tip],button [data-tip],.click [data-tip]{cursor:pointer}
@media (prefers-reduced-motion:reduce){.node.match.islive,.livedot,.livechip{animation:none}.livebadge i,.livetag i,.livechip i{animation:none}}

/* ===== v1.5 ===== */
#foot{max-width:1180px;margin:0 auto;padding:4px 16px 28px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}

body.tvmode #foot{display:none}
.mrow.ed{grid-template-columns:52px minmax(170px,1fr) auto auto auto}.mrow .pill.overdue{overflow:visible}
.cirow.ed{grid-template-columns:78px minmax(160px,1fr) auto auto auto}
.rowbtn{white-space:nowrap}
.pill.overdue{border-color:#F1C38A;color:#9A5A00;background:#FFF6E6}
.mrow.overdue,.cirow.overdue{box-shadow:inset 3px 0 0 #E59A2A}
.mrow.overdue .tt{color:#B26B00}
.node.match.overdue{border-color:#E59A2A;border-style:dashed}
.odtag{position:absolute;top:-10px;right:10px;background:#FFF1DC;color:#9A5A00;border:1px solid #F1C38A;font:600 10px var(--display);padding:1px 8px;border-radius:999px}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 2px 0 6px}.mdot.g{background:var(--gold)}.mdot.s{background:var(--silver)}.mdot.b{background:var(--bronze)}
.medal td.num[data-tip],.tvc .m[data-tip]{cursor:help}
.medal td.num[data-tip]:hover{background:var(--blue-l)}
.tr.vl{align-items:flex-start}.tr.vl b{text-align:left;font-size:12px}.tr.vl span{min-width:38px}
.steps{display:flex;gap:4px;list-style:none;padding:0;margin:8px 0 2px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 10px 3px 4px;border-radius:999px;background:var(--panel2);position:relative}
.steps li+li::before{content:"";position:absolute;left:-6px;top:50%;width:6px;height:1px;background:var(--line)}
.steps .sn{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--display);background:#fff;border:1px solid var(--line);color:var(--muted)}
.steps li.done{color:var(--ok)}.steps li.done .sn{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.cur{background:var(--blue);color:#fff}.steps li.cur .sn{background:#fff;border-color:#fff;color:var(--blue)}
.steps li.done.cur{background:var(--ok)}.steps li.done.cur .sn{color:var(--ok)}
.dlg .steps{margin:0 0 10px}
.howto{background:var(--blue-l);margin:4px 0 10px}
.howlist{margin:4px 0 6px 18px;padding:0;display:grid;gap:4px;font-size:14px}
fieldset.win.col{flex-direction:column;gap:10px}fieldset.win.col label{display:block}
@media (max-width:720px){.mrow.ed{grid-template-columns:46px 1fr}.mrow.ed .rowbtn{grid-column:1/-1;justify-self:start}.cirow.ed .rowbtn{grid-column:1/-1;justify-self:start}}

/* ===== v1.6 states / venues / unified map ===== */

.pill.cip{border-color:#B9C6F0;color:var(--blue);background:var(--blue-l)}

.pill.forfp{border-color:#F3A6AE;color:var(--bad);background:#FFF0F1;font-weight:600}
.mrow .pill{max-width:none}
.rbtns{display:inline-flex;gap:6px;justify-content:flex-end}
.btn.startb{background:var(--ok)}.btn.startb:hover{background:#1B6B3F}.btn.startb.notready{background:#fff;color:var(--ok);border:1px solid #9FD5B7}
.btn.forf{background:var(--bad)}.btn.forf:hover{background:#A3242C}

.odtag.forf{background:#FFF0F1;color:var(--bad);border-color:#F3A6AE}.odtag.ci{background:var(--blue-l);color:var(--blue);border-color:#B9C6F0}
.delaychip{display:inline-flex;align-items:center;gap:6px;background:#FFF1DC;color:#9A5A00;border:1px solid #F1C38A;text-decoration:none;font:600 12px var(--display);border-radius:999px;padding:3px 10px;margin-left:6px}
.stgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.stside{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.stside.ok{border-color:#9FD5B7;background:#EFFAF3}.stside.no{border-color:#F1C38A;background:#FFF8EC}
.node.center{padding:8px 12px;justify-content:flex-start;gap:2px;text-align:left}
.node.center .ch{display:flex;align-items:center;gap:4px}.node.center .ch b{font:600 15px var(--display);color:var(--blue-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpod{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}.cpod .cl{font-size:11px;color:var(--gold-t);margin-right:2px}.cpod .tm{font-size:12px}
.node.round{background:var(--blue);border-color:var(--blue);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:4px 10px;border-radius:10px}

.node.round.haslive{background:var(--live);border-color:var(--live)}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.venue.haslive{border-color:var(--live);box-shadow:0 0 0 1px var(--live)}
.pin{width:30px;height:30px;border-radius:10px;background:linear-gradient(145deg,#4B60BE,#2A3A88);position:relative;flex:none;margin-right:8px}
.pin::after{content:"";position:absolute;left:9px;top:6px;width:12px;height:12px;border-radius:50% 50% 50% 0;background:#fff;transform:rotate(-45deg)}
@media (max-width:720px){.vgrid{grid-template-columns:1fr}.stgrid{grid-template-columns:1fr}.mrow.ed .rbtns,.cirow.ed .rbtns{grid-column:1/-1;justify-self:start}}

/* ===== v1.7 layout polish ===== */

/* v1.8 */

function roomN(r) { return (S.students?.[`g${r.replace('/', '-')}`]?.list || []).length; }
function roomSex(r) { const l = S.students?.[`g${r.replace('/', '-')}`]?.list || []; return { m: l.filter(x => x.sex === 'ชาย').length, f: l.filter(x => x.sex === 'หญิง').length }; }
function planRooms(scope, how) {
  const K = COLORS.length; const rooms = roomsAll(); const asg = {};
  if (scope === 'new') rooms.forEach(r => { const c = colorOfRoom(r); if (c >= 0) asg[r] = c; });
  const byG = {}; rooms.forEach(r => (byG[r.split('/')[0]] = byG[r.split('/')[0]] || []).push(r));
  const tot = Array(K).fill(0); Object.entries(asg).forEach(([r, c]) => tot[c] += roomN(r));
  const free = {}; Object.entries(byG).forEach(([g, l]) => free[g] = l.filter(r => asg[r] == null));
  if (how === 'seq') {
    Object.entries(free).forEach(([g, l]) => { const cnt = Array(K).fill(0); byG[g].forEach(r => asg[r] != null && cnt[asg[r]]++);
      l.sort(clsSort).forEach(r => { const no = +r.split('/')[1]; let c = (no - 1) % K; if (scope === 'new') { const mn = Math.min(...cnt); for (let k = 0; k < K; k++) { const cc = (no - 1 + k) % K; if (cnt[cc] === mn) { c = cc; break; } } } asg[r] = c; cnt[c]++; }); });
    return asg;
  }
  // สมดุล: ทุกระดับชั้นแต่ละคณะได้จำนวนห้องต่างกันไม่เกิน 1 แล้วเลือกห้องให้ยอดนักเรียนรวมใกล้กัน
  Object.keys(free).sort().forEach(g => { const cnt = Array(K).fill(0); byG[g].forEach(r => asg[r] != null && cnt[asg[r]]++);
    free[g].slice().sort((a, b) => roomN(b) - roomN(a) || clsSort(a, b)).forEach(r => { const mn = Math.min(...cnt); let best = -1;
      for (let c = 0; c < K; c++) if (cnt[c] === mn && (best < 0 || tot[c] < tot[best])) best = c;
      asg[r] = best; cnt[best]++; tot[best] += roomN(r); }); });
  // ปรับละเอียด: สลับห้องในระดับเดียวกันระหว่างสองคณะถ้าทำให้ยอดรวมใกล้กันขึ้น (เฉพาะห้องที่จัดรอบนี้)
  const sq = () => tot.reduce((a, x) => a + x * x, 0);
  for (let pass = 0; pass < 30; pass++) { let imp = false;
    Object.values(free).forEach(l => { for (let i = 0; i < l.length; i++) for (let j = i + 1; j < l.length; j++) { const a = l[i], b = l[j], ca = asg[a], cb = asg[b]; if (ca === cb) continue;
      const d = roomN(a) - roomN(b); const before = sq(); tot[ca] -= d; tot[cb] += d; if (sq() < before) { asg[a] = cb; asg[b] = ca; imp = true; } else { tot[ca] += d; tot[cb] -= d; } } });
    if (!imp) break; }
  return asg;
}

/* ---------- จัดการการแข่งขัน ---------- */
function evSteps(e) {
  const matchy = ['ko', 'rr', 'rrko'].includes(e.format); const ms = e.matches || [];
  if (!matchy) { const hasTime = e.format === 'points' ? (e.rounds || []).length && (e.rounds || []).every(r => r.date) : !!e.date; return [
    { k: 'set', n: 'ตั้งค่ารายการ', done: (e.teams || []).length >= 2, act: `data-editev="${e.id}"` },
    { k: 'time', n: e.format === 'points' ? 'กำหนดรอบและวัน' : 'กำหนดวันแข่ง', done: !!hasTime, act: `data-editev="${e.id}"` }]; }
  return [
    { k: 'set', n: 'ตั้งค่ารายการ', done: (e.teams || []).length >= 2, act: `data-editev="${e.id}"` },
    { k: 'draw', n: 'จับคู่', done: ms.length > 0, act: `data-draw="${e.id}"` },
    { k: 'time', n: 'จัดเวลา', done: ms.length > 0 && ms.every(m => m.date && m.time), act: `data-sched="${e.id}"` },
    { k: 'check', n: 'ตรวจตารางคู่', done: e.reviewed !== false && ms.length > 0 && ms.every(m => m.date && m.time), act: `data-mlist="${e.id}"` }];
}
/* ขั้นที่เปิดได้: ตั้งค่าเปิดได้เสมอ · จับคู่ต้องมีคณะสี ≥ 2 · จัดเวลา/ตรวจต้องมีคู่แล้ว */
function stepOk(e, k) { const ms = e.matches || []; return k === 'set' || (k === 'draw' && (e.teams || []).length >= 2) || ((k === 'time' || k === 'check') && ms.length > 0); }
function stepper(e, cur) {
  const st = evSteps(e); const next = st.find(x => !x.done); const nav = !!e.id && MATCH_FMT.includes(e.format);
  const ci = st.findIndex(x => x.k === cur); const prev = nav && ci > 0 ? st[ci - 1] : null; const fwd = nav && ci >= 0 && ci < st.length - 1 && stepOk(e, st[ci + 1].k) ? st[ci + 1] : null;
  return `<ol class="steps">${st.map((x, i) => { const here = cur ? x.k === cur : x === next; const can = nav && !here && stepOk(e, x.k);
    const inner = `<span class="sn">${x.done ? '✓' : i + 1}</span>${x.n}`;
    return `<li class="${x.done ? 'done' : ''}${here ? ' cur' : ''}${can ? ' go' : ''}">${can ? `<button type="button" data-wstep="${x.k}|${e.id}" title="ไปขั้น “${x.n}”">${inner}</button>` : inner}</li>`; }).join('')}<li class="${next ? '' : 'done cur'}"><span class="sn">${next ? st.length + 1 : '✓'}</span>พร้อมแข่ง</li></ol>
    ${prev || fwd ? `<div class="wiznav">${prev ? `<button type="button" class="btn sm ghost" data-wstep="${prev.k}|${e.id}">← ย้อนกลับ: ${prev.n}</button>` : '<span></span>'}${fwd ? `<button type="button" class="btn sm ghost" data-wstep="${fwd.k}|${e.id}">ข้ามไป: ${fwd.n} →</button>` : ''}</div>` : ''}`;
}
/* เปลี่ยนขั้นในตัวช่วยเพิ่มรายการ ถ้ามีข้อมูลที่ยังไม่บันทึก ถามก่อน */
function goStep(k, eid, force) {

  $('#clr')?.addEventListener('click', () => save(null));

/* ---- roster editor ---- */
function openRoster(eid) {
  const ev = evById(eid); const c = UI.regColor; const r = clone(rosterOf(eid, c)); r.players = r.players || []; UI.pickq = '';
  const sched = athleteSchedule(c); const ro = !canRoster(c); const gendered = ev.gender === 'ชาย' || ev.gender === 'หญิง';
  const draw = () => {
    const lock = r.submitted || ro;
    const tmp = clone(S.rosters); S.rosters[rosterId(eid, c)] = { ...r }; const idx = athleteIndex(c); S.rosters = tmp;
    const max = rosterMax(ev); const errsAll = r.players.map(p => checkPlayer(ev, c, p, idx));
    const kc = {}, nc = {}; const kOf = p => p.sid || normName(p.name); const nOf = p => String(p.num ?? '').trim();
    r.players.forEach(p => { if (kOf(p)) kc[kOf(p)] = (kc[kOf(p)] || 0) + 1; if (nOf(p)) nc[nOf(p)] = (nc[nOf(p)] || 0) + 1; });
    let nHard = max && r.players.length > max ? 1 : 0;
    r.players.forEach((p, i) => { const h = []; if (kOf(p) && kc[kOf(p)] > 1) h.push('ชื่อซ้ำในรายการนี้'); if (nOf(p) && nc[nOf(p)] > 1) h.push(`เบอร์เสื้อ ${nOf(p)} ซ้ำ`); if (nOf(p) && !/^\d{1,3}$/.test(nOf(p))) h.push('เบอร์เสื้อต้องเป็นตัวเลข 1–3 หลัก'); if (h.length) { nHard++; errsAll[i].push(...h); } });
    const nErr = errsAll.filter(x => x.length).length + (max && r.players.length > max ? 1 : 0); const blockSend = nHard || (nErr && chkOn('block'));
    $('#modal').innerHTML = `<div class="dlg wide"><h3>${esc(evTitle(ev))} · ${chip(c)}</h3>
      <p class="muted sm">ส่งได้ไม่เกิน ${max} คน · ตัวจริง ${starters(ev)} คน${ev.age ? ` · รุ่น ${ev.age} ปี รับ ม.${AGES()[ev.age]?.join(', ม.')}` : ''}${r.submitted ? ` · <b class="okt">ส่งแล้ว</b>${r.submittedBy ? ' โดย ' + esc(nameOf(r.submittedBy)) : ''}` : r.by ? ` · แก้ล่าสุดโดย ${esc(nameOf(r.by))}` : ''}</p>
      ${max && r.players.length > max ? `<p class="warn">มี ${r.players.length} คน เกินกำหนด ${max} คน</p>` : ''}
      ${ro ? '<p class="muted sm">ดูได้อย่างเดียว เฉพาะครูคณะสีนี้หรือผู้ดูแลที่แก้ไขได้</p>' : ''}
      <div class="rtable">${r.players.map((p, i) => `<div class="rline"><span class="num muted">${i + 1}</span><input data-pf="${i}|name" value="${esc(p.name)}" placeholder="ชื่อ-สกุล" aria-label="ชื่อ-สกุล" ${lock ? 'disabled' : ''}><input data-pf="${i}|cls" class="num" value="${esc(p.cls)}" placeholder="ชั้น 3/6" aria-label="ชั้น" ${lock ? 'disabled' : ''}><input data-pf="${i}|num" class="num" value="${esc(p.num ?? '')}" placeholder="เบอร์" aria-label="เบอร์เสื้อ" ${lock ? 'disabled' : ''}>
        <select data-pf="${i}|sex" aria-label="เพศ" ${lock ? 'disabled' : ''}><option value="">เพศ</option><option ${p.sex === 'ชาย' ? 'selected' : ''}>ชาย</option><option ${p.sex === 'หญิง' ? 'selected' : ''}>หญิง</option></select>
        ${lock ? '<span></span>' : `<button class="x" data-prm="${i}" aria-label="ลบแถว">×</button>`}${errsAll[i].length ? `<small class="errt">${errsAll[i].map(esc).join(' · ')}</small>` : ''}${clashTxt(p)}</div>`).join('') || '<p class="muted">ยังไม่มีรายชื่อ</p>'}</div>
      ${lock || !allStudents().length ? '' : `<div class="picker"><label class="fld"><span>เลือกจากรายชื่อนักเรียนคณะ${COLORS[c].n}${ev.age ? ` (ม.${AGES()[ev.age].join(', ')})` : ''}${gendered ? ' · ' + ev.gender : ''}</span>${qbox('stpick', UI.pickq, 'พิมพ์ชื่อ ห้อง หรือเลขประจำตัว')}</label><div id="pickhits">${pickHits()}</div></div>`}
      ${lock ? '' : `<div class="actions"><button class="btn sm ghost" id="addp">+ เพิ่มแถวพิมพ์เอง</button></div>
      <details class="mt"><summary>วางรายชื่อจาก Excel</summary><p class="muted sm">คอลัมน์: ชื่อ-สกุล · ชั้น · เบอร์เสื้อ · เพศ (คั่นด้วยแท็บหรือจุลภาค) หนึ่งคนต่อบรรทัด ถ้าชื่อมีคำนำหน้า (ด.ช./ด.ญ./นาย/นางสาว) ระบบเติมเพศให้</p><textarea id="paste" rows="5"></textarea><button class="btn sm" id="dopaste">เพิ่มจากข้อความ</button></details>`}
      <p class="err" id="err"></p>
      <div class="actions">${ro ? '' : r.submitted ? `<button class="btn ghost" id="unsub">ยกเลิกการส่ง (แก้ไข)</button>` : `<button class="btn ghost" id="draft">บันทึกร่าง</button><button class="btn" id="submit" ${blockSend || !r.players.length ? 'disabled' : ''}>ส่งรายชื่อ</button>`}<button class="btn ghost" data-close>ปิด</button></div>
      ${!lock && nErr ? `<p class="muted sm">${blockSend ? 'แก้ข้อผิดพลาดให้ครบก่อนส่ง' : 'ยังมีคำเตือน ส่งได้แต่ควรตรวจอีกครั้ง'}</p>` : ''}</div>`;
    $('#addp')?.addEventListener('click', () => { r.players.push({ id: uid('p'), name: '', cls: '', num: '', sex: gendered ? ev.gender : '' }); draw(); $('#modal .rline:last-child input')?.focus(); });
    $('#dopaste')?.addEventListener('click', () => { $('#paste').value.split(/\n/).map(l => l.split(/\t|,/).map(s => s.trim())).filter(x => x[0]).forEach(([name, cls, num, sex]) => { const st = !cls ? findStudent(name, c) : null; if (st) { r.players.push({ id: uid('p'), sid: st.sid, name: stName(st), cls: st.cls, num: num || '', sex: st.sex }); return; } r.players.push({ id: uid('p'), name, cls: cls || '', num: num || '', sex: /ญ|หญิง|f/i.test(sex || '') ? 'หญิง' : /ช|ชาย|m/i.test(sex || '') ? 'ชาย' : sexFromPrefix(name) || (gendered ? ev.gender : '') }); }); draw(); });
    $('#draft')?.addEventListener('click', () => { save(false); toast('บันทึกร่างแล้ว'); });
    $('#submit')?.addEventListener('click', () => { save(true); logIt('ส่งรายชื่อ', `${evTitle(ev)} · ${COLORS[c].n} ${r.players.length} คน`); toast('ส่งรายชื่อแล้ว'); closeModal(); });
    $('#unsub')?.addEventListener('click', () => { r.submitted = false; save(false); logIt('ยกเลิกการส่งรายชื่อ', `${evTitle(ev)} · ${COLORS[c].n}`); draw(); });
  };
  const elig = eligible(ev, c);
  function pickHits() {
    const q = (UI.pickq || '').trim(); const have = new Set(r.players.map(p => p.sid || normName(p.name)));
    const l = elig.filter(st => !have.has(st.sid || normName(`${st.fn} ${st.ln}`)) && (!q || stName(st).includes(q) || st.cls === q.replace(/^ม\./, '') || String(st.sid).includes(q)));
    if (!elig.length) return `<p class="muted sm">ไม่มีนักเรียนที่ลงรายการนี้ได้ ตรวจการกำหนดห้องให้คณะ${COLORS[c].n}ในเมนู “คณะสีและนักเรียน”</p>`;
    return `<div class="hits">${l.slice(0, 24).map(st => `<button type="button" class="hit" data-stadd="${esc(st.cls + '|' + (st.sid || st.no))}"><b>${esc(stName(st))}</b><small>ม.${st.cls} · ${st.no}${st.sid ? ' · ' + esc(st.sid) : ''}</small></button>`).join('')}</div><p class="muted sm">${q ? `พบ ${l.length} คน` : `ลงได้ ${elig.length} คน`}${l.length > 24 ? ' · พิมพ์เพื่อค้นหาเพิ่ม' : ''}</p>`;
  }
  const save = (sub) => { r.players = r.players.filter(p => normName(p.name) || p.cls); r.submitted = !!sub; r.ev = eid; r.c = c; r.at = Date.now(); r.by = ME.id || ''; if (sub) r.submittedBy = ME.id || ''; if (sub) r.submittedAt = Date.now(); put('rosters', rosterId(eid, c), clone(r)); };
  $('#modal').hidden = false; draw();
  function clashTxt(p) { const cl = clashesOf((sched[pkey(p)] || []).concat(evItems(p))); return cl.length ? `<small class="warnt clt">เวลาชน: ${cl.slice(0, 2).map(([x, y]) => `${fmtDate(x.date)} ${x.time} ${esc(x.label)} กับ ${y.time} ${esc(y.label)}`).join(' · ')}</small>` : ''; }
  function evItems(p) { if ((sched[pkey(p)] || []).some(x => x.eid === eid)) return []; const out = []; (ev.matches || []).forEach(m => { const t = teamsOf(ev, m); if ((t.a === c || t.b === c) && m.date && m.time && !sideWin(m)) out.push({ eid, label: `${evTitle(ev)} คู่ ${m.no}`, date: m.date, time: m.time }); }); if (!(ev.matches || []).length && ev.date && ev.time) out.push({ eid, label: evTitle(ev), date: ev.date, time: ev.time }); return out; }
  $('#modal').oninput = e => { if (e.target.id === 'stpick') { UI.pickq = e.target.value; $('#pickhits').innerHTML = pickHits(); return; } const f = e.target.dataset.pf; if (!f) return; const [i, k] = f.split('|'); r.players[+i][k] = e.target.value; if (k === 'name' && !r.players[+i].sex) r.players[+i].sex = sexFromPrefix(e.target.value); };
  $('#modal').onchange = e => { if (e.target.dataset.pf) setTimeout(() => { const a = document.activeElement?.dataset?.pf; draw(); if (a) $(`#modal [data-pf="${a}"]`)?.focus(); }, 0); };
  $('#modal').onclick = e => {
    const b = e.target.closest('[data-prm]'); if (b) { r.players.splice(+b.dataset.prm, 1); draw(); mDirty = true; return; }
    const h = e.target.closest('[data-stadd]'); if (h) { const [cls, key] = h.dataset.stadd.split('|'); const st = elig.find(x => x.cls === cls && String(x.sid || x.no) === key); if (!st) return;
      if (rosterMax(ev) && r.players.length >= rosterMax(ev)) { toast(`ครบ ${rosterMax(ev)} คนแล้ว`); return; }
      r.players.push({ id: uid('p'), sid: st.sid, name: stName(st), cls: st.cls, num: '', sex: st.sex }); draw(); mDirty = true; $('#stpick')?.focus(); }
  };
}
function resetModalHandlers() { mDirty = false; $('#modal').oninput = null; $('#modal').onchange = null; $('#modal').onclick = null; }

/* ---- check-in ---- */
function openCheckin(eid, mid) {
  const ev = evById(eid); const m = mid ? mOf(ev, mid) : null;
  const sides = m ? (() => { const t = teamsOf(ev, m); return [['a', t.a], ['b', t.b]]; })() : (ev.teams || []).map(c => [String(c), c]);
  const ci = clone(m ? (m.ci || {}) : (ev.ci || {}));
  const col = ([k, c]) => {
    if (c < 0) return `<div class="cicol"><b>${esc(slotLabel(ev, m[k]))}</b><p class="muted sm">ยังไม่ทราบทีม</p></div>`;
    const ps = rosterOf(eid, c).players || []; const set = new Set(ci[k] || []); const B = bannedSet();
    return `<div class="cicol">${chip(c)} <small class="num muted">${set.size}/${starters(ev)} ตัวจริงขั้นต่ำ</small>
      ${ps.length ? `<label class="ck all"><input type="checkbox" data-all="${k}" ${ps.every(p => set.has(p.id)) ? 'checked' : ''}> ทั้งทีม</label>` + ps.map(p => { const ban = isBanned(c, p, B); return `<label class="ck${ban ? ' banned' : ''}"><input type="checkbox" data-ck="${k}|${p.id}" ${set.has(p.id) ? 'checked' : ''} ${ban ? 'disabled' : ''}> <span class="num muted">${esc(p.num || '')}</span> ${esc(p.name)} <small class="muted">${esc(p.cls)}${ban ? ' · ถูกตัดสิทธิ์' : ''}</small></label>`; }).join('') : '<p class="muted sm">คณะนี้ยังไม่ส่งรายชื่อ</p>'}
      ${m && !sideWin(m) && canScore(ev.sport) ? `<button class="btn sm danger" data-forfeit="${k}">${COLORS[c].n} สละสิทธิ์</button>` : ''}</div>`;
  };
  const draw = () => {
    $('#modal').innerHTML = `<div class="dlg wide"><h3>รายงานตัว · ${esc(evTitle(ev))}${m ? ` · คู่ ${m.no} ${esc(m.time || '')}` : ''}</h3><div class="cigrid">${sides.map(col).join('')}</div>
      <div class="actions"><button class="btn" id="saveci">บันทึกการรายงานตัว</button><button class="btn ghost" data-close>ปิด</button></div></div>`;
  };
  $('#modal').hidden = false; draw();
  $('#modal').onchange = e => {
    const a = e.target.dataset.all, k = e.target.dataset.ck;
    if (a) { const c = sides.find(s => s[0] === a)[1]; const B = bannedSet(); ci[a] = e.target.checked ? (rosterOf(eid, c).players || []).filter(p => !isBanned(c, p, B)).map(p => p.id) : []; draw(); }
    if (k) { const [s, id] = k.split('|'); const set = new Set(ci[s] || []); e.target.checked ? set.add(id) : set.delete(id); ci[s] = [...set]; draw(); }
  };
  $('#modal').onclick = e => {
    if (e.target.id === 'saveci') { closeModal(); resetModalHandlers(); recUndo('บันทึกรายงานตัว', `${evTitle(ev)}${m ? ' คู่ ' + m.no : ''}`, patchEv(m ? { eid, mid, set: { ci } } : { eid, set: { ci } })); return; }
    const f = e.target.closest('[data-forfeit]'); if (f) { const loser = f.dataset.forfeit; ask(`ยืนยันให้ ${COLORS[sides.find(s => s[0] === loser)[1]].n} สละสิทธิ์ (ปรับแพ้)`, () => { recUndo('ปรับแพ้ (สละสิทธิ์)', `${evTitle(ev)} คู่ ${m.no}`, patchEv({ eid, mid, set: { w: loser === 'a' ? 'b' : 'a', auto: false, sa: '', sb: '', note: 'ชนะเพราะคู่แข่งสละสิทธิ์', at: Date.now(), by: ME.id || '', forfeit: loser, endedAt: Date.now(), ci }, unset: ['live'] })); }, 'ยืนยันปรับแพ้'); }
  };
}

async function importAll(o, label) {

  if (o.meta && typeof o.meta === 'object') jobs.push(['meta', 'config', o.meta]);

  let i = 0;
  for (const [col, id, v] of jobs) {
    for (let tries = 0; tries < 5; tries++) {
      try { await db.collection(col).doc(id).set(v); break; }
      catch (e) { if (e?.code === 'invalid_argument' || e?.code === 'permission-denied') { toast('บัญชีนี้ไม่มีสิทธิ์บันทึก'); return; } await new Promise(r => setTimeout(r, 800 * (tries + 1))); }

}

  const el = e.target.closest('[data-res],[data-evres],[data-round],[data-open],[data-day],[data-ciday],[data-msport],[data-mev],[data-regc],[data-roster],[data-ci],[data-cie],[data-adsport],[data-editsport],[data-delsport],[data-addev],[data-editev],[data-delev],[data-draw],[data-sched],[data-mlist],[data-rmday],[data-agrm],[data-undo],[data-tvp],[data-user],[data-rmuser],[data-mapv],[data-mapbg],[data-wstep],[data-close],[data-act],[data-role],[data-rmrole],[data-orient],[data-clrev],[data-start],[data-forf],[data-vday],[data-editvenue],[data-ttab],[data-judge],[data-rmst],#editbtn');
  if (!el || (el.closest('#modal') && !el.matches('[data-close],[data-undo],[data-wstep]'))) return;
  const d = el.dataset; el.closest('details.menu')?.removeAttribute('open');
  if (d.wstep) { const [k, id] = d.wstep.split('|'); goStep(k, id); return; }
  if (el.id === 'editbtn') { editOn = !editOn; render(); return; }
  if ('close' in d) { tryClose(); return; }
  resetModalHandlers();
  if (d.res) { const [a, b] = d.res.split('|'); openResult(a, b); }
  else if (d.evres) openEvResult(d.evres);
  else if (d.round) { const [a, b] = d.round.split('|'); openRound(a, +b); }
  else if (d.open) { const ev = S.events[d.open]; if (ev) { UI.mapSport = ev.sport; UI.mapEv = d.open; if (location.hash !== '#map') location.hash = 'map'; else render(); } }
  else if (d.day) { UI.day = d.day; render(); }
  else if (d.ciday) { UI.ciDay = d.ciday; render(); }
  else if (d.msport) { UI.mapSport = d.msport; UI.mapEv = null; render(); }
  else if (d.mev) { UI.mapEv = d.mev; render(); }
  else if (d.regc) { UI.regColor = +d.regc; render(); }
  else if (d.roster) openRoster(d.roster);
  else if (d.ci) { const [a, b] = d.ci.split('|'); openCheckin(a, b); }
  else if (d.cie) openCheckin(d.cie);
  else if (d.adsport) { UI.adSport = d.adsport; render(); }
  else if (d.editsport) openSport(d.editsport);
  else if (d.delsport) { const n = eventsOf(d.delsport).length; ask(`ลบชนิดกีฬา “${sportName(d.delsport)}”${n ? ` และ ${n} รายการในนั้น` : ''}?`, () => { const nm = sportName(d.delsport); eventsOf(d.delsport).forEach(ev => put('events', ev.id, null)); put('sports', d.delsport, null); UI.adSport = null; logIt('ลบชนิดกีฬา', nm); }, 'ลบ'); }
  else if (d.addev) openEvent(null, d.addev);
  else if (d.editev) { WIZ = d.wiz ? d.editev : null; openEvent(d.editev); }
  else if (d.delev) { const t = evTitle(evById(d.delev)); ask(`ลบรายการ “${t}” พร้อมคู่และผลทั้งหมด?`, () => { put('events', d.delev, null); logIt('ลบรายการ', t); }, 'ลบ'); }
  else if (d.draw) openDraw(d.draw);
  else if (d.sched) openSchedule(d.sched);
  else if (d.mlist) openMatchList(d.mlist);
  else if (d.rmday) { const n = allMatches().filter(x => x.m.date === d.rmday).length + Object.values(S.events).filter(e => e.date === d.rmday || (e.rounds || []).some(r => r.date === d.rmday)).length;
    if (n) { toast(`ลบวัน ${fmtDate(d.rmday)} ไม่ได้: มี ${n} คู่/รายการแข่งวันนี้ ย้ายไปวันอื่นก่อน`); return; }
    ask(`ลบวันแข่งขัน ${fmtDate(d.rmday, true)}?`, () => { const m = clone(S.meta); m.days = (m.days || []).filter(x => x !== d.rmday); put('meta', 'config', m); logIt('ลบวันแข่งขัน', d.rmday); closeModal(); }, 'ลบวัน'); }
  else if (d.role) openRole(d.role);
  else if (d.rmrole) ask(`ลบสิทธิ์ของ ${nameOf(d.rmrole)}?`, () => { const m = clone(S.meta); delete m.roles[d.rmrole]; put('meta', 'config', m); logIt('ลบสิทธิ์ผู้ใช้', nameOf(d.rmrole)); }, 'ลบ');
  else if (d.act === 'addrole') { const em = ($('#uemail').value || '').trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast('กรอกอีเมลให้ถูกต้อง'); return; } const m = clone(S.meta); m.roles = m.roles || {}; if (!m.roles[em]) m.roles[em] = { role: 'scorer' }; put('meta', 'config', m); openRole(em); }
  else if (d.act === 'login') { if (mode === 'local') openLogin(); else signIn(); }
  else if (d.act === 'logout') { if (mode === 'local') { logIt('ออกจากระบบ', ME.name); setMe(null); } else signOut(); }
  else if (d.act === 'adduser') openUser();
  else if (d.user) openUser(d.user);
  else if (d.rmuser) ask(`ลบผู้ใช้ ${nameOf(d.rmuser)}?`, () => { const m = clone(S.meta); const n = nameOf(d.rmuser); delete m.users[d.rmuser]; put('meta', 'config', m); logIt('ลบผู้ใช้', n); }, 'ลบ');
  else if (d.act === 'fs') { const c = $('#mapcard'); if (document.fullscreenElement) document.exitFullscreen(); else c?.requestFullscreen?.().catch(() => toast('เบราว์เซอร์นี้ไม่รองรับเต็มจอ')); }
  else if (d.orient) { UI.mapOrient = d.orient === 'auto' ? null : d.orient; render(); }
  else if (d.act === 'dlsched') exportSchedule();
  else if (d.act === 'reset') openReset();
  else if (d.ttab) { UI.teamTab = d.ttab; render(); }
  else if (d.judge) { const [a, b] = d.judge.split('|'); openJudge(a, +b); }
  else if (d.act === 'addstudent') openAddStudent();
  else if (d.act === 'clearstudents') ask('ลบรายชื่อนักเรียนทั้งหมด? (รายชื่อนักกีฬาที่ส่งแล้วไม่ถูกลบ)', async () => { for (const id of Object.keys(S.students || {})) await put('students', id, null); logIt('ลบรายชื่อนักเรียนทั้งหมด', ''); toast('ลบแล้ว'); }, 'ลบทั้งหมด');
  else if (d.rmst) { const [cls, key] = d.rmst.split('|'); const id = `g${cls.replace('/', '-')}`; const dd = clone(S.students[id]); dd.list = dd.list.filter(st => String(st.sid || st.no) !== key); put('students', id, dd.list.length ? dd : null); }
  else if (d.act === 'addroom') { const m = ($('#newroom').value || '').trim().match(/^(\d)\s*\/\s*(\d+)$/); if (!m) { toast('รูปแบบห้อง เช่น 1/13'); return; } UI.extraRooms = [...(UI.extraRooms || []), `${m[1]}/${+m[2]}`]; const mm = clone(S.meta); mm.classes = mm.classes || {}; toast('เลือกคณะสีให้ห้องใหม่ในตาราง'); UI.pendingRoom = `${m[1]}/${+m[2]}`; render(); }
  else if (d.start) { const [a, b] = d.start.split('|'); openStart(a, b); }
  else if (d.forf) { const [a, b] = d.forf.split('|'); openForfeit(a, b); }
  else if (d.vday) { UI.vDay = d.vday; render(); }
  else if (d.editvenue) openVenue(d.editvenue);
  else if (d.act === 'addvenue') openVenue(null);
  else if (d.clrev) { const t = evTitle(evById(d.clrev)); ask(`ล้างผลทั้งหมดของ “${t}” (คงคู่และเวลาไว้)?`, () => { put('events', d.clrev, stripResults(clone(S.events[d.clrev]))); logIt('ล้างผลรายการ', t); toast('ล้างผลแล้ว'); }, 'ล้างผล'); }
  else if (d.act === 'dlmedal') exportMedals();
  else if (d.act === 'dlroster') exportRosters(UI.regColor);
  else if (d.act === 'dlrosterall') exportRosters(null);
  else if (d.act === 'dlci') exportCheckin();
  else if (d.act === 'sheets') openPrint();
  else if (d.act === 'qr') openQR();
  else if (d.act === 'report') openReport();
  else if (d.act === 'pinmap') openPinning();
  else if (d.act === 'mapdesel') { UI.mapV = null; render(); }
  else if (d.act === 'mapori') { UI.mapOri = mapOri() === 'l' ? 'p' : 'l'; render(); }
  else if (d.act === 'tvexit') exitTV();
  else if (d.act === 'tvfs') { if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => toast('เบราว์เซอร์ไม่อนุญาตเต็มจอ กด F11 แทน')); }
  else if (d.act === 'medrec') exportRecipients('print');
  else if (d.act === 'medrecc') exportRecipients('csv');
  else if (d.act === 'tvauto') { UI.tvAuto = UI.tvAuto === false; tvTick = Date.now(); render(); }
  else if (d.act === 'savescore') { const act = $('#scA').value.split(/[,\s]+/).filter(Boolean); if ([$('#scG').value, $('#scS').value, $('#scB').value, ...act].some(x => isNaN(+x) || +x < 0)) { toast('คะแนนต้องเป็นตัวเลขไม่ติดลบ'); return; }
    const m = clone(S.meta); m.scoring = { on: $('#scOn').checked, g: +$('#scG').value || 0, s: +$('#scS').value || 0, b: +$('#scB').value || 0, act: act.map(Number) }; put('meta', 'config', m); logIt('แก้คะแนนรวมคณะสี', ''); toast('บันทึกแล้ว'); }
  else if (d.act === 'copysum') copy(summaryText());
  else if (d.act === 'copyroster') copy(rosterText(UI.regColor));
  else if (d.act === 'backup') openBackup();
  else if (d.act === 'template') { el.disabled = true; importTemplate(); }
  else if (d.act === 'addsport') openSport(null);
  else if (d.act === 'classes') openClasses();
  else if (d.act === 'addday') { const v = $('#newday').value; if (!v) { toast('เลือกวันที่ก่อน'); return; } if (days().includes(v)) { toast('มีวันนี้อยู่แล้ว'); return; } const m = clone(S.meta); m.days = [...new Set([...(m.days || []), v])].sort(); put('meta', 'config', m); }
  else if (d.act === 'savemeta') {
    const v = { ci: +$('#ciMin').value, f: +$('#fMin').value, cl: +$('#clMin').value };
    if ([v.ci, v.cl].some(x => !Number.isFinite(x) || x < 0) || !(v.f >= 1)) { toast('ตรวจตัวเลขกติกา: ต้องเป็นจำนวนไม่ติดลบ (ผ่อนผันอย่างน้อย 1 นาที)'); return; }
    const m = clone(S.meta); m.checkinMin = v.ci; m.forfeitMin = v.f; m.requireCheckin = $('#reqCi').checked; if ($('#pinCf')) m.pinConfirm = $('#pinCf').checked; m.clashMin = v.cl; put('meta', 'config', m); logIt('แก้กติกาทั่วไป', ''); toast('บันทึกกติกาแล้ว'); }
  else if (d.act === 'saveinfo') {
    const t = $('#mtitle').value.trim(), y = $('#myear').value.trim(), sc = $('#mschool').value.trim();
    if (!t) { toast('ใส่ชื่องาน'); return; } if (y && !/^25\d\d$/.test(y)) { toast('ปีการศึกษาเป็นเลข พ.ศ. 4 หลัก เช่น 2569'); return; }
    const m = clone(S.meta); m.title = t; m.year = y; m.school = sc || DEF_SCHOOL; put('meta', 'config', m); logIt('แก้ข้อมูลงาน', t); toast('บันทึกข้อมูลงานแล้ว'); }
  else if (d.act === 'bknow') { takeSnap(true); download(`สำรองข้อมูล-${evName()}-${todayStr()}.json`, JSON.stringify(S)); logIt('ดาวน์โหลดไฟล์สำรอง', todayISO()); markBackup(); toast('ดาวน์โหลดไฟล์สำรองแล้ว'); }
  else if (d.act === 'bklater') { try { sessionStorage.setItem('gem-bklater', todayISO()); } catch (e) { } render(); }
  else if (d.act === 'gorules') { UI.teamTab = 'rules'; location.hash = 'teams'; }
  else if (d.act === 'autorooms') openAutoRooms();
  else if (d.act === 'saverules') saveRules();
  else if (d.act === 'addage') { const a = +$('#newage').value; if (!(a >= 6 && a <= 25)) { toast('รุ่นอายุ 6–25 ปี'); return; } const ag = clone(AGES()); if (ag[a]) { toast(`มีรุ่น ${a} ปีแล้ว`); return; } ag[a] = []; UI.newAge = a; const m = clone(S.meta); m.ageGrades = ag; put('meta', 'config', m); toast(`เพิ่มรุ่น ${a} ปีแล้ว เลือกระดับชั้นที่ลงได้`); }
  else if (d.act === 'agedef') ask('คืนค่ารุ่นอายุตามสูจิบัตร (รุ่น 14/16/18 และ 15/17)?', () => { const m = clone(S.meta); delete m.ageGrades; put('meta', 'config', m); logIt('คืนค่ารุ่นอายุ', ''); closeModal(); }, 'คืนค่า');
  else if (d.mapv) { UI.mapV = UI.mapV === d.mapv && UI.view === 'fieldmap' ? null : d.mapv; if (UI.view !== 'fieldmap') location.hash = 'fieldmap'; else render(); }
  else if (d.mapbg) { if (UI.mapV) { UI.mapV = null; render(); } }
  else if (d.tvp) { UI.tvP = d.tvp; tvTick = Date.now(); render(); }
  else if (d.undo) { const l = LOG.find(x => x.id === d.undo); if (l) doUndo(l); }
  else if (d.agrm) { const a = d.agrm; const n = Object.values(S.events).filter(e => String(e.age) === a).length; if (n) { toast(`ลบไม่ได้: มี ${n} รายการใช้รุ่นนี้`); return; } const ag = clone(AGES()); delete ag[a]; const m = clone(S.meta); m.ageGrades = ag; put('meta', 'config', m); logIt('ลบรุ่นอายุ', a); }
});
document.addEventListener('toggle', e => { if (e.target.dataset?.regsp && e.target.open) UI.regOpen = e.target.dataset.regsp; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && e.target.matches?.('input[type=search]') && e.target.value) { e.preventDefault(); clearQ(e.target.id); return; }
  if (e.key === 'Escape' && !$('#modal').hidden) tryClose();
  else if (e.key === 'Escape' && UI.view === 'tv' && !document.fullscreenElement) exitTV();
  else if (e.key === 'Escape' && UI.view === 'fieldmap' && UI.mapV) { UI.mapV = null; render(); }
  if (e.key === 'Enter' && e.target.matches('[tabindex="0"]')) e.target.click();
});
document.addEventListener('change', e => {
  const tg = e.target;
  if (tg.dataset.room) { const r = tg.dataset.room; const m = clone(S.meta); m.classes = m.classes || {}; Object.keys(m.classes).forEach(k => m.classes[k] = (m.classes[k] || []).filter(x => x !== r)); for (let i = 0; i < 6; i++) m.classes[i] = m.classes[i] || []; if (tg.value !== '') m.classes[tg.value].push(r); put('meta', 'config', m); logIt('กำหนดห้องให้คณะสี', `ม.${r} → ${tg.value === '' ? 'ไม่กำหนด' : COLORS[+tg.value].n}`); }
  if (tg.dataset.agk) { const [a, g] = tg.dataset.agk.split('|'); const ag = clone(AGES()); const l = new Set(ag[a] || []); tg.checked ? l.add(+g) : l.delete(+g);
    ag[a] = [...l].sort(); const m = clone(S.meta); m.ageGrades = ag; put('meta', 'config', m); logIt('แก้รุ่นอายุ', `รุ่น ${a} ปี: ม.${ag[a].join(',') || '-'}`); }
  if (tg.dataset.cname) { const m = clone(S.meta); m.colorNames = m.colorNames || []; m.colorNames[+tg.dataset.cname] = tg.value.trim(); put('meta', 'config', m); logIt('แก้ชื่อคณะสี', tg.value.trim()); }
  if (tg.dataset.cinfo) { const [c, k] = tg.dataset.cinfo.split('|'); const m = clone(S.meta); m.colorInfo = m.colorInfo || {}; m.colorInfo[c] = { ...(m.colorInfo[c] || {}), [k]: tg.value.trim() }; put('meta', 'config', m); }
  if (tg.id === 'stfile' && tg.files[0]) { importStudentsFile(tg.files[0]); tg.value = ''; }
  if (tg.id === 'stroom') { UI.stRoom = tg.value; render(); }
  if (e.target.id === 'sportF') { UI.sportF = e.target.value; render(); }
  if (e.target.id === 'aclash') { UI.onlyClash = e.target.checked; $('#athres').innerHTML = athleteResults(); }
});
function clearQ(id) { const el = document.getElementById(id); if (!el) return; el.value = ''; el.dispatchEvent(new Event('input', { bubbles: true })); el.focus(); }
document.addEventListener('click', e => { const x = e.target.closest('[data-qx]'); if (x) { e.stopPropagation(); clearQ(x.dataset.qx); } }, true);
document.addEventListener('input', e => {
  if (e.target.matches?.('.qbox input')) { const b = e.target.parentNode.querySelector('.qx'); if (b) b.hidden = !e.target.value; }
  if (e.target.id === 'stq') { UI.stq = e.target.value; const q = UI.stq.trim(), room = UI.stRoom || ''; const used = usedMap(); const list = allStudents().filter(st => (!room || st.cls === room) && (!q || stName(st).includes(q) || String(st.sid).includes(q))).sort((a, b) => clsSort(a.cls, b.cls) || a.no - b.no); $('#stlist').innerHTML = studentTable(list, used); }
  if (e.target.id === 'aq') { UI.q = e.target.value; $('#athres').innerHTML = athleteResults(); }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (UI.view === 'map') render(); }, 150); });
document.addEventListener('fullscreenchange', () => { if (UI.view === 'map') render(); });
setInterval(() => { if (['medals', 'tv', 'schedule', 'map', 'checkin'].includes(UI.view) && $('#modal').hidden && mode !== 'connecting' && !document.activeElement?.matches('input,select,textarea')) { hideTip(); render(); } }, 60000);
function exitTV() { if (document.fullscreenElement) document.exitFullscreen?.().catch(() => { }); location.hash = UI.prevView && UI.prevView !== 'tv' ? UI.prevView : 'medals'; }
function route() { const raw = location.hash.slice(1); const [h, arg] = raw.split('~'); const nv = VIEWS.some(v => v[0] === h) ? h : 'medals';
  if (nv === 'tv' && UI.view && UI.view !== 'tv') UI.prevView = UI.view;
  if (nv === 'venues' && arg) { UI.vFocus = decodeURIComponent(arg); UI.vScroll = true; }
  if (nv !== UI.view) { UI.day = UI.ciDay = UI.vDay = null; UI.stq = ''; UI.q = ''; UI.pickq = ''; }
  UI.view = nv; $('#main').dataset.view = ''; window.scrollTo(0, 0); render(); }
window.addEventListener('hashchange', route);
route(); initData();

</script>
